[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "osintkit"
version = "1.3.0"
description = "Stdlib-only CLI bundling 29 open-source-intelligence tools with an interactive menu"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
imaging = ["pillow"]

[project.scripts]
osintkit = "osintkit:main"

[tool.setuptools]
py-modules = ["osintkit"]
